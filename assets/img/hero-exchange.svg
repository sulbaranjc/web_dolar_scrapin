<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <defs>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="note2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- halo -->
  <circle cx="270" cy="220" r="190" fill="#10b981" opacity=".08"/>
  <circle cx="270" cy="220" r="130" fill="#0ea5e9" opacity=".08"/>
  <!-- tablet con gráfico -->
  <g filter="url(#sh)">
    <rect x="150" y="70" width="260" height="190" rx="22" fill="url(#screen)" stroke="#334155"/>
    <rect x="172" y="92" width="80" height="10" rx="5" fill="#475569"/>
    <rect x="172" y="110" width="50" height="8" rx="4" fill="#334155"/>
    <path d="M172 225 L210 200 L240 210 L275 170 L305 182 L340 140 L388 120" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M172 225 L210 200 L240 210 L275 170 L305 182 L340 140 L388 120 V240 H172 Z" fill="#34d399" opacity=".12"/>
    <circle cx="388" cy="120" r="7" fill="#34d399" stroke="#0f172a" stroke-width="3"/>
  </g>
  <!-- billete EUR -->
  <g filter="url(#sh)" transform="rotate(-10 150 300)">
    <rect x="50" y="250" width="210" height="110" rx="14" fill="url(#note2)"/>
    <rect x="62" y="262" width="186" height="86" rx="9" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="155" cy="305" r="28" fill="#fff" fill-opacity=".2"/>
    <text x="155" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">€</text>
  </g>
  <!-- billete USD -->
  <g filter="url(#sh)" transform="rotate(8 330 320)">
    <rect x="230" y="270" width="210" height="110" rx="14" fill="url(#note)"/>
    <rect x="242" y="282" width="186" height="86" rx="9" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="335" cy="325" r="28" fill="#fff" fill-opacity=".2"/>
    <text x="335" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">$</text>
  </g>
  <!-- monedas -->
  <g filter="url(#sh)">
    <ellipse cx="450" cy="210" rx="38" ry="38" fill="url(#coin)"/>
    <ellipse cx="450" cy="210" rx="28" ry="28" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <text x="450" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e">£</text>
  </g>
  <g filter="url(#sh)">
    <ellipse cx="95" cy="150" rx="32" ry="32" fill="url(#coin)"/>
    <ellipse cx="95" cy="150" rx="23" ry="23" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <text x="95" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#92400e">¥</text>
  </g>
  <!-- flechas de intercambio -->
  <g transform="translate(250 380)">
    <circle r="26" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <path d="M-11 -4h18l-5-5M11 4h-18l5 5" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
